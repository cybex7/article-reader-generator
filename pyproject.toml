[project]
name = "article-reader-generator"
version = "1.0.0"
description = "مبدل متن ساده/مارک‌داون به صفحه مطالعه HTML مستقل با تایپوگرافی فارسی و تم‌های سه‌گانه"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Arash Abdous" }]
dependencies = ["trafilatura>=2.0", "markdown>=3.6", "mdx-truly-sane-lists>=1.3"]

[project.scripts]
article-reader = "article_reader.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/article_reader"]
